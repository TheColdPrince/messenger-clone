<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Relay Chat — Educational Messaging UI</title>
  <style>
    :root{
      --bg:#18191a;
      --surface:#242526;
      --surface-2:#2f3031;
      --surface-3:#3a3b3c;
      --surface-hover:#303132;
      --selected:#263a4a;
      --text:#e4e6eb;
      --muted:#b0b3b8;
      --muted-2:#8a8d91;
      --border:#393a3b;
      --accent:#2d78ff;
      --accent-2:#7b2cff;
      --accent-soft:rgba(45,120,255,.18);
      --danger:#ff4f66;
      --success:#45bd62;
      --shadow:0 10px 35px rgba(0,0,0,.22);
      --topbar:80px;
      --radius:14px;
      --sidebar:500px;
      --info:430px;
      --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    html[data-theme="light"]{
      --bg:#f2f3f5;
      --surface:#ffffff;
      --surface-2:#f0f2f5;
      --surface-3:#e4e6eb;
      --surface-hover:#eef0f2;
      --selected:#e7f3ff;
      --text:#1c1e21;
      --muted:#65676b;
      --muted-2:#8a8d91;
      --border:#d9dde3;
      --accent:#246bfe;
      --accent-2:#6a45ff;
      --accent-soft:rgba(36,107,254,.12);
      --shadow:0 8px 28px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      overflow:hidden;
      font-family:var(--font);
      background:var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    button,input{font:inherit}
    button{color:inherit}
    svg{display:block}

    .sr-only{
      position:absolute!important;
      width:1px;height:1px;
      padding:0;margin:-1px;
      overflow:hidden;clip:rect(0,0,0,0);
      white-space:nowrap;border:0;
    }

    .app{
      height:100dvh;
      display:grid;
      grid-template-rows:var(--topbar) minmax(0,1fr);
      background:var(--bg);
    }

    /* ---------- top bar ---------- */
    .topbar{
      position:relative;
      z-index:30;
      display:grid;
      grid-template-columns:minmax(300px,1fr) minmax(440px,650px) minmax(300px,1fr);
      align-items:center;
      height:var(--topbar);
      padding:0 20px;
      background:var(--surface);
      border-bottom:1px solid var(--border);
      box-shadow:0 1px 0 rgba(255,255,255,.01);
    }

    .brand-zone,.account-zone,.topnav{
      display:flex;
      align-items:center;
      min-width:0;
    }

    .brand-zone{gap:12px}
    .account-zone{justify-content:flex-end;gap:10px}

    .brand{
      width:52px;height:52px;
      border:0;border-radius:50%;
      display:grid;place-items:center;
      cursor:pointer;
      background:linear-gradient(145deg,var(--accent),var(--accent-2));
      color:white;
      box-shadow:0 4px 16px rgba(45,120,255,.22);
      flex:0 0 auto;
      transition:transform .16s ease,filter .16s ease;
    }
    .brand:hover{transform:translateY(-1px);filter:brightness(1.05)}
    .brand svg{width:27px;height:27px}

    .global-search{
      width:46px;height:46px;
      border-radius:50%;
      border:0;
      background:var(--surface-3);
      display:grid;place-items:center;
      color:var(--muted);
      cursor:pointer;
      transition:.16s ease;
    }
    .global-search:hover{background:var(--surface-hover);color:var(--text)}
    .global-search svg{width:22px;height:22px}

    .topnav{
      height:100%;
      justify-content:space-between;
      gap:6px;
    }
    .topnav-btn{
      position:relative;
      width:110px;height:100%;
      border:0;background:transparent;
      color:var(--muted);
      display:grid;place-items:center;
      cursor:pointer;
      border-radius:10px;
      transition:background .16s ease,color .16s ease;
    }
    .topnav-btn:hover{background:var(--surface-hover);color:var(--text)}
    .topnav-btn.active{color:var(--accent)}
    .topnav-btn.active::after{
      content:"";
      position:absolute;
      left:12px;right:12px;bottom:0;
      height:3px;
      background:var(--accent);
      border-radius:3px 3px 0 0;
    }
    .topnav-btn svg{width:31px;height:31px}

    .circle-action{
      width:46px;height:46px;
      border:0;border-radius:50%;
      background:var(--surface-3);
      color:var(--text);
      display:grid;place-items:center;
      cursor:pointer;
      transition:transform .15s ease,background .15s ease;
      flex:0 0 auto;
    }
    .circle-action:hover{background:var(--surface-hover);transform:translateY(-1px)}
    .circle-action svg{width:22px;height:22px}
    .theme-button{position:relative}
    .theme-button .sun{display:none}
    html[data-theme="light"] .theme-button .moon{display:none}
    html[data-theme="light"] .theme-button .sun{display:block}

    .avatar{
      --avatar-size:48px;
      width:var(--avatar-size);
      height:var(--avatar-size);
      border-radius:50%;
      flex:0 0 auto;
      position:relative;
      display:grid;
      place-items:center;
      overflow:hidden;
      color:white;
      font-weight:800;
      letter-spacing:.3px;
      user-select:none;
      background:
        radial-gradient(circle at 36% 30%,rgba(255,255,255,.35),transparent 22%),
        linear-gradient(145deg,var(--avatar-a,#2481ff),var(--avatar-b,#7b3cff));
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
    }
    .avatar.small{--avatar-size:46px}
    .avatar.medium{--avatar-size:58px;font-size:19px}
    .avatar.large{--avatar-size:102px;font-size:30px}
    .avatar.tiny{--avatar-size:34px;font-size:11px}
    .avatar .status{
      position:absolute;
      right:1px;bottom:1px;
      width:13px;height:13px;
      background:var(--success);
      border:3px solid var(--surface);
      border-radius:50%;
    }

    /* ---------- main layout ---------- */
    .workspace{
      min-height:0;
      display:grid;
      grid-template-columns:minmax(340px,var(--sidebar)) minmax(520px,1fr) minmax(350px,var(--info));
      gap:18px;
      padding-right:18px;
      background:var(--bg);
    }

    .sidebar{
      min-height:0;
      display:flex;
      flex-direction:column;
      border-right:1px solid var(--border);
      background:var(--surface);
    }

    .sidebar-head{
      flex:0 0 auto;
      padding:18px 20px 8px;
    }
    .title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .title-row h1{
      margin:0;
      font-size:31px;
      line-height:1.15;
      letter-spacing:-.7px;
    }
    .title-actions{display:flex;gap:10px}

    .messenger-search{
      margin-top:18px;
      height:47px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:0 15px;
      border-radius:24px;
      background:var(--surface-3);
      color:var(--muted);
    }
    .messenger-search svg{width:22px;height:22px;flex:0 0 auto}
    .messenger-search input{
      width:100%;
      min-width:0;
      border:0;outline:0;
      background:transparent;
      color:var(--text);
      font-size:17px;
    }
    .messenger-search input::placeholder{color:var(--muted)}

    .tabs{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:18px;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar{display:none}
    .tab{
      border:0;
      background:transparent;
      color:var(--text);
      font-weight:700;
      padding:9px 16px;
      border-radius:20px;
      white-space:nowrap;
      cursor:pointer;
      font-size:16px;
    }
    .tab:hover{background:var(--surface-hover)}
    .tab.active{background:var(--accent-soft);color:var(--accent)}

    .chat-list{
      min-height:0;
      overflow-y:auto;
      padding:0 10px 18px;
      scrollbar-color:var(--muted-2) transparent;
      scrollbar-width:thin;
    }

    .chat-list-empty{
      display:none;
      padding:36px 18px;
      color:var(--muted);
      text-align:center;
    }

    .chat-item{
      width:100%;
      min-height:92px;
      border:0;
      padding:10px 12px;
      border-radius:12px;
      display:flex;
      gap:13px;
      align-items:center;
      text-align:left;
      background:transparent;
      color:inherit;
      cursor:pointer;
      transition:background .13s ease;
      margin:2px 0;
    }
    .chat-item:hover{background:var(--surface-hover)}
    .chat-item.active{background:var(--selected)}
    .chat-copy{min-width:0;flex:1}
    .chat-name{
      font-size:17px;
      line-height:1.25;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .chat-preview{
      margin-top:6px;
      color:var(--muted);
      font-size:15px;
      display:flex;
      min-width:0;
      gap:4px;
      align-items:center;
    }
    .chat-preview span:first-child{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width:0;
    }
    .chat-preview time{white-space:nowrap;flex:0 0 auto}
    .unread-dot{
      width:10px;height:10px;
      border-radius:50%;
      background:var(--accent);
      margin-left:8px;
      flex:0 0 auto;
    }

    /* ---------- chat panel ---------- */
    .chat-shell,.info-panel{
      min-height:0;
      margin:16px 0;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .chat-shell{
      display:flex;
      flex-direction:column;
      position:relative;
    }

    .chat-header{
      flex:0 0 auto;
      height:76px;
      padding:0 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid var(--border);
      background:var(--surface);
      position:relative;
      z-index:4;
    }
    .chat-user{
      display:flex;
      align-items:center;
      min-width:0;
      gap:12px;
    }
    .chat-user-copy{min-width:0}
    .chat-user-name{
      font-weight:800;
      font-size:20px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .chat-user-status{
      color:var(--muted);
      font-size:13px;
      margin-top:2px;
    }
    .header-actions{
      display:flex;
      align-items:center;
      gap:18px;
      color:var(--accent-2);
      flex:0 0 auto;
    }
    .header-action{
      width:34px;height:34px;
      border:0;
      background:transparent;
      color:var(--accent-2);
      display:grid;place-items:center;
      cursor:pointer;
      border-radius:50%;
      transition:background .14s ease;
    }
    .header-action:hover{background:var(--surface-hover)}
    .header-action svg{width:25px;height:25px}

    .mobile-back{
      display:none;
      width:38px;height:38px;
      border:0;border-radius:50%;
      background:transparent;
      color:var(--accent);
      place-items:center;
      cursor:pointer;
      margin-left:-8px;
    }
    .mobile-back:hover{background:var(--surface-hover)}

    .messages{
      min-height:0;
      flex:1;
      overflow-y:auto;
      overscroll-behavior:contain;
      padding:24px 22px 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      scrollbar-color:var(--muted-2) transparent;
      scrollbar-width:thin;
      scroll-behavior:smooth;
    }

    .time-marker{
      margin:5px auto 2px;
      color:var(--muted);
      font-size:13px;
      text-align:center;
    }

    .message-row{
      display:flex;
      align-items:flex-end;
      gap:8px;
      max-width:88%;
      animation:messageIn .19s ease both;
    }
    @keyframes messageIn{
      from{opacity:0;transform:translateY(5px)}
      to{opacity:1;transform:none}
    }
    .message-row.incoming{align-self:flex-start}
    .message-row.outgoing{
      align-self:flex-end;
      justify-content:flex-end;
    }
    .message-row .avatar{margin-bottom:2px}
    .message-stack{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
      max-width:100%;
    }
    .incoming .message-stack{align-items:flex-start}
    .outgoing .message-stack{align-items:flex-end}

    .bubble{
      display:inline-block;
      max-width:min(650px,100%);
      padding:10px 14px;
      border-radius:20px;
      background:var(--surface-3);
      color:var(--text);
      font-size:16px;
      line-height:1.38;
      overflow-wrap:anywhere;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.01);
    }
    .outgoing .bubble{
      background:linear-gradient(160deg,#3278ff,#2e61ef);
      color:#fff;
      border-bottom-right-radius:7px;
    }
    .incoming .bubble{border-bottom-left-radius:7px}
    .reaction{
      margin-top:-3px;
      margin-right:5px;
      font-size:20px;
      line-height:1;
      filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
    }

    .shared-card{
      width:min(670px,100%);
      border-radius:18px;
      overflow:hidden;
      background:var(--surface-2);
      border:1px solid var(--border);
      box-shadow:0 4px 18px rgba(0,0,0,.12);
    }
    .demo-screen{
      min-height:178px;
      padding:18px;
      background:
        linear-gradient(180deg,#eef2f6,#dfe6ed);
      color:#2b2d31;
      position:relative;
    }
    .demo-bar{
      height:15px;
      width:100%;
      border-radius:7px;
      background:#d1d8e0;
      margin-bottom:12px;
    }
    .demo-table{
      width:100%;
      border-collapse:collapse;
      font-size:11px;
      background:white;
      box-shadow:0 1px 4px rgba(0,0,0,.12);
    }
    .demo-table th,.demo-table td{
      padding:6px 7px;
      border:1px solid #d9dfe6;
      text-align:left;
      white-space:nowrap;
    }
    .demo-table th{background:#f6f8fa;font-weight:700}
    .link-preview{
      background:linear-gradient(145deg,#6529ee,#8725ff);
      color:white;
      padding:17px 18px;
      font-size:17px;
      font-weight:700;
      line-height:1.22;
    }
    .link-preview strong{display:block}
    .preview-meta{
      padding:12px 16px 15px;
      background:var(--surface-3);
      color:var(--muted);
    }
    .preview-meta b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

    .composer{
      flex:0 0 auto;
      min-height:77px;
      padding:10px 14px 12px;
      display:flex;
      align-items:flex-end;
      gap:10px;
      border-top:1px solid transparent;
      background:var(--surface);
    }

    .composer-tools{
      display:flex;
      align-items:center;
      gap:10px;
      height:48px;
      color:var(--accent);
      flex:0 0 auto;
    }
    .tool-button,.send-button{
      width:34px;height:34px;
      border:0;border-radius:50%;
      background:transparent;
      color:var(--accent);
      display:grid;place-items:center;
      cursor:pointer;
      transition:background .14s ease,transform .14s ease;
    }
    .tool-button:hover,.send-button:hover{background:var(--surface-hover);transform:translateY(-1px)}
    .tool-button svg,.send-button svg{width:23px;height:23px}

    .composer-input-wrap{
      min-width:0;
      flex:1;
      min-height:44px;
      display:flex;
      align-items:center;
      border-radius:24px;
      background:var(--surface-3);
      padding:0 8px 0 16px;
    }
    .composer-input{
      width:100%;
      min-width:0;
      border:0;outline:0;
      background:transparent;
      color:var(--text);
      height:44px;
      font-size:16px;
    }
    .composer-input::placeholder{color:var(--muted)}

    /* ---------- right info ---------- */
    .info-panel{
      display:flex;
      flex-direction:column;
      overflow-y:auto;
      scrollbar-width:thin;
      scrollbar-color:var(--muted-2) transparent;
    }
    .profile-area{
      padding:40px 24px 22px;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    .profile-name{
      margin:16px 0 0;
      font-size:22px;
      font-weight:800;
      line-height:1.15;
    }
    .profile-sub{
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
    }
    .profile-actions{
      margin-top:26px;
      display:flex;
      justify-content:center;
      gap:36px;
    }
    .profile-action{
      width:58px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:9px;
      color:var(--muted);
      font-size:14px;
    }
    .profile-action button{
      width:47px;height:47px;
      border:0;border-radius:50%;
      display:grid;place-items:center;
      background:var(--surface-3);
      color:var(--text);
      cursor:pointer;
      transition:.15s ease;
    }
    .profile-action button:hover{background:var(--surface-hover);transform:translateY(-1px)}
    .profile-action svg{width:22px;height:22px}

    .info-sections{padding:4px 10px 18px}
    .info-section{
      border-radius:10px;
      overflow:hidden;
    }
    .info-toggle{
      width:100%;
      min-height:58px;
      border:0;
      background:transparent;
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 12px;
      font-weight:800;
      text-align:left;
      cursor:pointer;
      border-radius:10px;
    }
    .info-toggle:hover{background:var(--surface-hover)}
    .chevron{
      width:18px;height:18px;
      transition:transform .18s ease;
    }
    .info-section.open .chevron{transform:rotate(180deg)}
    .section-body{
      display:grid;
      grid-template-rows:0fr;
      transition:grid-template-rows .2s ease;
    }
    .info-section.open .section-body{grid-template-rows:1fr}
    .section-body-inner{overflow:hidden}
    .section-link{
      display:flex;
      align-items:center;
      gap:11px;
      min-height:44px;
      margin:2px 8px 6px;
      padding:0 12px;
      border-radius:9px;
      color:var(--muted);
      font-size:14px;
    }
    .section-link:hover{background:var(--surface-hover);color:var(--text)}

    .toast{
      position:fixed;
      left:50%;
      bottom:24px;
      z-index:100;
      transform:translate(-50%,16px);
      opacity:0;
      pointer-events:none;
      padding:11px 16px;
      border-radius:10px;
      background:var(--text);
      color:var(--bg);
      font-weight:700;
      font-size:14px;
      box-shadow:var(--shadow);
      transition:.2s ease;
    }
    .toast.show{
      transform:translate(-50%,0);
      opacity:1;
    }

    /* ---------- responsive ---------- */
    @media (max-width:1380px){
      :root{--sidebar:390px}
      .workspace{
        grid-template-columns:minmax(320px,var(--sidebar)) minmax(480px,1fr);
        padding-right:16px;
      }
      .info-panel{display:none}
      .topbar{grid-template-columns:minmax(250px,1fr) minmax(420px,620px) minmax(250px,1fr)}
    }

    @media (max-width:1020px){
      :root{--sidebar:330px}
      .topbar{
        grid-template-columns:1fr auto;
        gap:12px;
      }
      .topnav{display:none}
      .workspace{
        grid-template-columns:minmax(300px,var(--sidebar)) minmax(0,1fr);
        gap:10px;
        padding-right:10px;
      }
      .sidebar-head{padding-inline:14px}
      .title-row h1{font-size:28px}
      .chat-shell{margin:10px 0}
      .composer-tools .hide-tablet{display:none}
    }

    @media (max-width:760px){
      :root{--topbar:64px}
      body{overflow:hidden}
      .topbar{
        padding:0 10px;
        grid-template-columns:1fr auto;
      }
      .brand{width:44px;height:44px}
      .brand svg{width:23px;height:23px}
      .global-search{width:40px;height:40px}
      .account-zone .circle-action{width:40px;height:40px}
      .account-zone .desktop-only{display:none}
      .account-zone .avatar{--avatar-size:40px}

      .workspace{
        display:block;
        padding:0;
        height:100%;
      }
      .sidebar{
        height:100%;
        border-right:0;
      }
      .chat-shell{
        display:none;
        margin:0;
        height:100%;
        border:0;
        border-radius:0;
        box-shadow:none;
      }

      body.chat-open .sidebar{display:none}
      body.chat-open .chat-shell{display:flex}
      .mobile-back{display:grid}
      .chat-header{height:67px;padding-inline:12px}
      .header-actions{gap:7px}
      .header-action{width:37px;height:37px}
      .chat-user-name{font-size:17px}
      .chat-user-status{display:none}
      .messages{padding:18px 12px 12px}
      .message-row{max-width:96%}
      .bubble{font-size:15px}
      .composer{
        padding:8px 8px max(8px,env(safe-area-inset-bottom));
        gap:5px;
        min-height:64px;
      }
      .composer-tools{gap:2px;height:44px}
      .composer-tools .mobile-hide{display:none}
      .tool-button,.send-button{width:34px;height:34px}

            </div>
            <div class="link-preview">
              <strong>Demo link:</strong>
              relay.local/demo/attendance
            </div>
            <div class="preview-meta">
              <b>Sign in · Demo Attendance Portal</b>
              relay.local
            </div>
          </div>
        `;
      }

      function renderMessages(chat) {
        els.messages.innerHTML = chat.messages.map(message => {
          if (message.kind === 'time') {
            return `<div class="time-marker">${escapeHTML(message.text)}</div>`;
          }

          if (message.kind === 'share') {
            return `
              <div class="message-row incoming">
                <div class="avatar tiny" style="${avatarStyle(chat)}">${escapeHTML(chat.initials)}</div>
                <div class="message-stack">${sharedCardHTML()}</div>
              </div>
            `;
          }

          const avatar = message.side === 'incoming'
            ? `<div class="avatar tiny" style="${avatarStyle(chat)}">${escapeHTML(chat.initials)}</div>`
            : '';

          return `
            <div class="message-row ${message.side}">
              ${avatar}
              <div class="message-stack">
                <div class="bubble">${escapeHTML(message.text)}</div>
                ${message.reaction ? `<div class="reaction">${message.reaction}</div>` : ''}
              </div>
            </div>
          `;
        }).join('');

        requestAnimationFrame(() => {
          els.messages.scrollTop = els.messages.scrollHeight;
        });
      }

      function applyChatMeta(chat) {
        [els.chatAvatar, els.profileAvatar].forEach(el => {
          el.textContent = chat.initials;
          el.setAttribute('style', avatarStyle(chat));
        });

        els.chatName.textContent = chat.name;
        els.chatStatus.textContent = chat.status;
        els.profileName.textContent = chat.name;
        els.profileStatus.textContent = chat.status;
      }

      function selectChat(id) {
        const chat = chats.find(item => item.id === id);
        if (!chat) return;
        activeId = id;
        chat.unread = false;
        applyChatMeta(chat);
        renderMessages(chat);
        renderChats();

        if (matchMedia('(max-width: 760px)').matches) {
          els.body.classList.add('chat-open');
          setTimeout(() => els.input.focus(), 180);
        }
      }

      function sendMessage(text) {
        const cleaned = text.trim();
        if (!cleaned) return;

        const chat = chats.find(item => item.id === activeId);
        if (!chat) return;

        chat.messages.push({ kind: 'text', side: 'outgoing', text: cleaned });
        chat.preview = `You: ${cleaned}`;
        chat.time = 'now';
        renderMessages(chat);
        renderChats();
      }

      function setTheme(theme) {
        const normalized = theme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = normalized;
        localStorage.setItem('relay-theme', normalized);
      }

      function loadTheme() {
        const saved = localStorage.getItem('relay-theme');
        if (saved) {
          setTheme(saved);
          return;
        }
        setTheme(matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      }

      function showToast(message) {
        clearTimeout(toastTimer);
        els.toast.textContent = message;
        els.toast.classList.add('show');
        toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1800);
      }

      els.search.addEventListener('input', renderChats);

      qsa('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          activeFilter = tab.dataset.filter;
          qsa('.tab').forEach(item => item.classList.toggle('active', item === tab));
          renderChats();
        });
      });

      els.composer.addEventListener('submit', event => {
        event.preventDefault();
        sendMessage(els.input.value);
        els.input.value = '';
      });

      qs('#emojiButton').addEventListener('click', () => {
        els.input.value += ' 😊';
        els.input.focus();
      });

      els.themeToggle.addEventListener('click', () => {
        setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      els.mobileBack.addEventListener('click', () => {
        els.body.classList.remove('chat-open');
      });

      els.infoToggle.addEventListener('click', () => {
        if (matchMedia('(max-width: 1380px)').matches) {
          showToast('Conversation details are shown on wider screens.');
          return;
        }
        const hidden = getComputedStyle(els.infoPanel).display === 'none';
        if (hidden) {
          els.infoPanel.style.display = 'flex';
        } else {
          els.infoPanel.style.display = 'none';
        }
      });

      qsa('.info-toggle').forEach(toggle => {
        toggle.addEventListener('click', () => {
          toggle.closest('.info-section').classList.toggle('open');
        });
      });

      qsa('.topnav-btn').forEach(button => {
        button.addEventListener('click', () => {
          qsa('.topnav-btn').forEach(item => item.classList.remove('active'));
          button.classList.add('active');
        });
      });

      qsa('.tool-button, .profile-action button, .circle-action').forEach(button => {
        if (button.id === 'themeToggle' || button.id === 'emojiButton') return;
        button.addEventListener('click', event => {
          const label = event.currentTarget.getAttribute('aria-label');
          if (label && !['Search', 'More chat options', 'New message'].includes(label)) {
            showToast(`${label} is a demo interaction.`);
          }
        });
      });

      window.addEventListener('resize', () => {
        if (!matchMedia('(max-width: 760px)').matches) {
          els.body.classList.remove('chat-open');
        }
      }, { passive: true });

      loadTheme();
      renderChats();
      selectChat(activeId);
    })();
  </script>
</body>
</html>
